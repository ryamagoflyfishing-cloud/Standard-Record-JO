    const AGE_GROUPS_INDIVIDUAL = ['9歳以下', '10歳', '11歳', '12歳', '13歳', '14歳', '15~16歳', 'CS'];
    const STYLES_INDIVIDUAL = ['自由形', '背泳ぎ', '平泳ぎ', 'バタフライ', '個人メドレー'];
    const AGE_GROUPS_RELAY = ['10歳以下', '11~12歳', '13~14歳', 'CS'];
    const STYLES_RELAY = ['フリーリレー', 'メドレーリレー'];

    function App() {
      const [data, setData] = useState([]);
      const [activeTab, setActiveTab] = useState('個人');
      const [poolType, setPoolType] = useState('短水路');
      const [gender, setGender] = useState('男子');
      const [ageGroup, setAgeGroup] = useState('CS');
      const [style, setStyle] = useState('自由形');
      const [distance, setDistance] = useState('');
      const [userTime, setUserTime] = useState('');

      useEffect(() => {
        if (activeTab === '個人') {
          if (!AGE_GROUPS_INDIVIDUAL.includes(ageGroup)) setAgeGroup('CS');
          if (!STYLES_INDIVIDUAL.includes(style)) setStyle('自由形');
        } else {
          if (!AGE_GROUPS_RELAY.includes(ageGroup)) setAgeGroup('CS');
          if (!STYLES_RELAY.includes(style)) setStyle('フリーリレー');
        }
      }, [activeTab]);

      useEffect(() => {
        const lines = DEFAULT_CSV_DATA.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) return;

        const parsedData = lines.slice(1).map(line => {
          const [pool, gen, ageRaw, sty, distRaw, time] = line.split(',').map(s => s?.trim().replace(/^"|"$/g, '') || '');
          
          const toHalfWidth = (str) => {
            if(!str) return '';
            return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
          };
          
          const age = toHalfWidth(ageRaw);
          const dist = toHalfWidth(distRaw);

          let normalizedAge = age;
          if (age.includes('10歳以下') || age === '10以下') normalizedAge = '10歳以下,9歳以下,10歳';
          else if (age.includes('9歳以下') || age === '9以下') normalizedAge = '9歳以下';
          else if (age.includes('14歳以下') || age === '14以下') normalizedAge = '13歳,14歳'; 
          else if (age.includes('11') && age.includes('12')) normalizedAge = '11~12歳,11歳,12歳';
          else if (age.includes('13') && age.includes('14')) normalizedAge = '13~14歳,13歳,14歳';
          else if (age.includes('15') && age.includes('16')) normalizedAge = '15~16歳';
          else if (age.includes('CS') || age.toLowerCase().includes('cs') || age.includes('18')) normalizedAge = 'CS';
          else if (age.includes('10')) normalizedAge = '10歳';
          else if (age.includes('11')) normalizedAge = '11歳';
          else if (age.includes('12')) normalizedAge = '12歳';
          else if (age.includes('13')) normalizedAge = '13歳';
          else if (age.includes('14')) normalizedAge = '14歳';
          
          let normalizedStyle = sty;
          if (sty.includes('フリーリレー') || (sty.includes('継') && !sty.includes('メドレー')) || sty.toLowerCase() === 'fr') {
            if (sty.includes('リレー') || sty.includes('継')) normalizedStyle = 'フリーリレー';
            else normalizedStyle = '自由形';
          }
          if (sty.includes('メドレーリレー') || sty.includes('MR')) normalizedStyle = 'メドレーリレー';
          else if (sty.includes('個') || sty.toLowerCase().includes('im')) normalizedStyle = '個人メドレー';
          else if (sty.includes('自') || sty.toLowerCase() === 'fr' || sty.toLowerCase() === 'free') normalizedStyle = '自由形';
          else if (sty.includes('背') || sty.toLowerCase() === 'ba' || sty.toLowerCase() === 'back') normalizedStyle = '背泳ぎ';
          else if (sty.includes('平') || sty.toLowerCase() === 'br' || sty.toLowerCase() === 'breast') normalizedStyle = '平泳ぎ';
          else if (sty.includes('バ') || sty.toLowerCase() === 'fly' || sty.toLowerCase() === 'bu') normalizedStyle = 'バタフライ';
          
          let cleanDist = dist.replace(/[^0-9x×]/gi, '');
          if (cleanDist.includes('4x50') || cleanDist.includes('4×50')) cleanDist = '200';
          if (cleanDist.includes('4x100') || cleanDist.includes('4×100')) cleanDist = '400';
          cleanDist = cleanDist.replace(/[^0-9]/g, '');

          return { pool, gender: gen, age: normalizedAge, style: normalizedStyle, distance: cleanDist, time };
        }).flatMap(item => {
          if (item.age && item.age.includes(',')) return item.age.split(',').map(a => ({ ...item, age: a }));
          return item;
        });

        setData(parsedData);
      }, []);

      const filteredData = useMemo(() => {
        return data.filter(d => 
          d.pool === poolType && d.gender === gender && d.age === ageGroup && d.style === style
        );
      }, [data, poolType, gender, ageGroup, style]);

      const availableDistances = useMemo(() => {
        return [...new Set(filteredData.map(d => d.distance))].filter(Boolean).sort((a, b) => Number(a) - Number(b));
      }, [filteredData]);

      useEffect(() => {
        if (availableDistances.length > 0 && !availableDistances.includes(distance)) {
          setDistance(availableDistances[0]);
        } else if (availableDistances.length === 0) {
          setDistance('');
        }
      }, [availableDistances, distance]);

      const targetRecord = filteredData.find(d => d.distance === distance);

      const formatTargetTime = (timeStr) => {
        if (!timeStr || timeStr === '--') return '--';
        if (!timeStr.includes('.')) return `${timeStr}.00`;
        const [seconds, milliseconds] = timeStr.split('.');
        if (milliseconds.length === 1) return `${seconds}.${milliseconds}0`;
        return timeStr;
      };

      const displayTargetTime = targetRecord ? formatTargetTime(targetRecord.time) : '--';

      const timeToSeconds = (timeStr) => {
        if (!timeStr || timeStr === '--') return null;
        const parts = timeStr.split(':');
        let minutes = 0, secondsAndMs = timeStr;
        if (parts.length === 2) {
          minutes = parseInt(parts[0], 10);
          secondsAndMs = parts[1];
        }
        return minutes * 60 + parseFloat(secondsAndMs);
      };
      
      const secondsToTime = (sec) => {
         const m = Math.floor(sec / 60);
         const s = (sec % 60).toFixed(2);
         if (m > 0) return `${m}:${s.padStart(5, '0')}`;
         return s;
      };

      let relayAverageStr = null;
      if (activeTab === 'リレー' && style === 'フリーリレー' && displayTargetTime !== '--') {
        const totalSec = timeToSeconds(displayTargetTime);
        if (totalSec) {
           const avgSec = Math.floor((totalSec / 4) * 100) / 100;
           relayAverageStr = secondsToTime(avgSec);
        }
      }

      const calculateDifference = () => {
        if (!displayTargetTime || displayTargetTime === '--' || !userTime) return null;
        const targetSec = timeToSeconds(displayTargetTime);
        const userSec = timeToSeconds(userTime);
        if (targetSec === null || isNaN(userSec)) return null;
        const diff = userSec - targetSec;
        return { value: Math.abs(diff).toFixed(2), isAchieved: diff <= 0 };
      };

      const diff = calculateDifference();
      const themeColor = poolType === '短水路' ? 'blue' : 'emerald';
      const currentAgeGroups = activeTab === '個人' ? AGE_GROUPS_INDIVIDUAL : AGE_GROUPS_RELAY;
      const currentStyles = activeTab === '個人' ? STYLES_INDIVIDUAL : STYLES_RELAY;

      return (
        // ↓ スマホの最新画面サイズ(100dvh)に対応しつつ、一番下にたっぷりの余白(pb-40)を追加 ↓
        <div className="min-h-[100dvh] bg-gray-50 text-gray-800 font-sans p-4 sm:p-6 pb-40">
          <div className="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100">
            <div className={`bg-${themeColor}-600 text-white p-5 text-center transition-colors duration-300`}>
              <h1 className="text-xl font-bold tracking-wider">JO標準記録検索</h1>
            </div>

            <div className="p-5 space-y-5">
              <div className="flex bg-gray-100 p-1 rounded-xl">
                {['個人', 'リレー'].map(tab => (
                  <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-all ${activeTab === tab ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>
                    {tab}
                  </button>
                ))}
              </div>
              <div className="flex gap-4">
                <div className="flex flex-1 bg-gray-100 p-1 rounded-xl">
                  {['短水路', '長水路'].map(type => (
                    <button key={type} onClick={() => setPoolType(type)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${poolType === type ? `bg-white shadow text-${themeColor}-600` : 'text-gray-500 hover:text-gray-700'}`}>
                      {type}
                    </button>
                  ))}
                </div>
                <div className="flex flex-1 bg-gray-100 p-1 rounded-xl">
                  {['男子', '女子'].map(g => (
                    <button key={g} onClick={() => setGender(g)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${gender === g ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>
                      {g}
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1.5 ml-1">年齢区分</label>
                  <select value={ageGroup} onChange={e => setAgeGroup(e.target.value)} className="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium appearance-none">
                    {currentAgeGroups.map(age => <option key={age} value={age}>{age}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1.5 ml-1">種目</label>
                  <select value={style} onChange={e => setStyle(e.target.value)} className="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium appearance-none">
                    {currentStyles.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1.5 ml-1">距離 (m)</label>
                  <select value={distance} onChange={e => setDistance(e.target.value)} className="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium appearance-none">
                    {availableDistances.length > 0 ? availableDistances.map(dist => <option key={dist} value={dist}>{dist}m</option>) : <option value="">データなし</option>}
                  </select>
                </div>
              </div>
            </div>

            <div className={`bg-${themeColor}-50/50 p-6 text-center border-t border-${themeColor}-100 relative`}>
              <p className="text-xs font-bold text-gray-500 mb-1 tracking-widest">標準記録</p>
              <div className={`text-5xl font-black tracking-tight text-${themeColor}-700 drop-shadow-sm`}>
                {displayTargetTime}
              </div>
              {relayAverageStr && (
                <div className={`mt-3 inline-block px-3 py-1 bg-${themeColor}-100 text-${themeColor}-800 rounded-full text-sm font-bold`}>
                  1人あたり平均: {relayAverageStr}
                </div>
              )}
            </div>

            <div className="p-6 bg-white border-t border-gray-100">
              <label className="block text-xs font-bold text-gray-500 mb-2 text-center">自分のタイムを入力して比較</label>
              <!-- ↓ スマホでテンキーが開きやすいように inputMode="text" を明記し、フォントサイズも16px(text-base)を保証 ↓ -->
              <input type="text" inputMode="text" placeholder="例: 1:04.55 または 31.02" value={userTime} onChange={e => setUserTime(e.target.value)} className="w-full text-center text-base sm:text-lg bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium mb-4"/>
              
              {diff && (
                <div className={`p-4 rounded-xl text-center border ${diff.isAchieved ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-rose-50 border-rose-200 text-rose-700'}`}>
                  {diff.isAchieved ? (
                    <div className="font-bold">🎉 突破しています！<br/><span className="text-xl">-{diff.value}秒</span></div>
                  ) : (
                    <div className="font-bold">あと <span className="text-2xl mx-1">{diff.value}</span> 秒</div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
